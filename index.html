<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3182f6">
  <meta name="description" content="임신부터 육아까지, 우리 가족이 챙길 혜택과 신청 일정을 한곳에서. 기기에 저장되는 CHECK 체크리스트.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CHECK">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v2.css">
  <title>CHECK · 우리 가족의 시작</title>
</head>
<body>
  <a href="#main" class="skip-link">본문으로 건너뛰기</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <a class="brand" href="#home" aria-label="CHECK 홈"><span class="brand-mark" aria-hidden="true">✓</span>CHECK<span class="brand-dot">.</span></a>
      <p class="brand-caption">우리 가족의 시작</p>
      <nav id="desktop-nav" class="desktop-nav"></nav>
      <div class="sidebar-bottom"><span class="lock-dot"></span><div><strong>내 기기에만 저장돼요</strong><p>회원가입 · 광고 · 추적 없음</p></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a href="#home" class="mobile-brand"><span class="brand-mark" aria-hidden="true">✓</span>CHECK.</a>
        <span class="desktop-kicker">A LITTLE CHECK, A BIG RELIEF.</span>
        <div class="topbar-right"><span id="network-status" class="network-status">기기 저장</span><button class="icon-button" id="install-top" data-action="install" aria-label="앱 설치 안내"></button><button class="icon-button" data-view="settings" aria-label="우리 가족 설정" id="settings-top"></button></div>
      </header>
      <div id="update-banner" class="update-banner" hidden><span>새 앱 버전이 준비됐어요. 체크 기록은 그대로 유지돼요.</span><button data-action="update">새로 열기</button></div>
      <main id="main" tabindex="-1"><div class="loading"><span class="loading-check">✓</span><h1>우리 가족의 준비를<br>한곳에 모으고 있어요.</h1><p>잠시 후에도 열리지 않으면 로컬 실행 안내를 확인해 주세요.</p></div></main>
      <footer class="page-footer">CHECK · 공식기관과 제휴하지 않은 개인용 준비 도구<br><span id="footer-meta">정보 확인일 2026.10.14 · 실제 신청·선정은 해당 기관에서</span></footer>
    </div>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="하단 메뉴"></nav>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="utility-dialog" class="utility-dialog" aria-labelledby="utility-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">CHECK는 체크 상태 저장을 위해 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용해 주세요.</div></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
